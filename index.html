<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headbound SMP | Professional Minecraft Server</title>
    <link rel="icon" type="image/png" sizes="64x64" href="https://img.icons8.com/color/64/minecraft-grass-cube.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#f2f5f3',
                            100: '#dfe9e3',
                            200: '#c0d4c9',
                            300: '#93b5a5',
                            400: '#5f8f78',
                            500: '#426e57',
                            600: '#325443',
                            700: '#284335',
                            800: '#21362b',
                            900: '#1c2d24',
                            950: '#0e1813'
                        },
                        blue: {
                            50:  '#fdf6ee',
                            100: '#f9e8d0',
                            200: '#f2cfa0',
                            300: '#e9b06a',
                            400: '#df923e',
                            500: '#C68642',
                            600: '#C68642',
                            700: '#8B5A2B',
                            800: '#6b3f1a',
                            900: '#4a2a0e',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --green-glow: #C68642;
            --brand: #C68642;
            --brand-dark: #8B5A2B;
            --brand-light: #fdf6ee;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #111827;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .text-green-glow {
            color: var(--green-glow);
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .shine-effect {
            position: relative;
            overflow: hidden;
        }

        .shine-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .shine-effect:hover::after {
            left: 100%;
            top: 100%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* ── Override blue → brand orange #C68642 ── */
        .text-blue-400, .text-blue-500, .text-blue-600 { color: #C68642 !important; }
        .text-blue-700 { color: #8B5A2B !important; }
        .bg-blue-600 { background-color: #C68642 !important; }
        .bg-blue-50 { background-color: #fdf6ee !important; }
        .bg-blue-100 { background-color: #f9e8d0 !important; }
        .border-blue-100 { border-color: #f2cfa0 !important; }
        .border-blue-200 { border-color: #f2cfa0 !important; }
        .border-blue-500 { border-color: #C68642 !important; }
        .hover\:bg-blue-500:hover { background-color: #b8752e !important; }
        .hover\:bg-blue-50:hover { background-color: #fdf6ee !important; }
        .hover\:bg-blue-100:hover { background-color: #f9e8d0 !important; }
        .hover\:text-blue-600:hover { color: #C68642 !important; }
        .hover\:text-blue-500:hover { color: #C68642 !important; }
        .hover\:border-blue-200:hover { border-color: #f2cfa0 !important; }
        .focus\:border-blue-500:focus { border-color: #C68642 !important; }
        .group:hover .group-hover\:bg-blue-100 { background-color: #f9e8d0 !important; }
        .group:hover .group-hover\:text-blue-600 { color: #C68642 !important; }
        .group:hover .group-hover\:border-blue-200 { border-color: #f2cfa0 !important; }
        .group:hover .group-hover\:scale-110 { transform: scale(1.1); }
        .bg-blue-600.shadow-xl { box-shadow: 0 20px 40px rgba(198,134,66,0.25) !important; }
        .shadow-blue-600\/20 { --tw-shadow-color: rgba(198,134,66,0.2) !important; box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow) !important; }
        .w-0.group-hover\:w-full, .bg-blue-500 { background-color: #C68642 !important; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f3f4f6;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React and Dependencies -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.3",
        "react-dom": "https://esm.sh/react-dom@19.2.3",
        "react-dom/client": "https://esm.sh/react-dom@19.2.3/client",
        "lucide-react": "https://esm.sh/lucide-react@0.562.0",
        "htm": "https://esm.sh/htm@3.1.1",
        "framer-motion": "https://esm.sh/framer-motion@12.38.0"
      }
    }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
